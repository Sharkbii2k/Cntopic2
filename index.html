<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Học Tiếng Trung Thực Chiến</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .hanzi {
            font-family: 'Noto Sans SC', sans-serif;
        }
        /* Thanh cuộn gọn gàng */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .tab-active {
            border-bottom: 3px solid #ef4444;
            color: #ef4444;
            font-weight: 600;
            background-color: #fef2f2;
        }
        .topic-active {
            background-color: #ef4444;
            color: white;
            font-weight: 600;
        }
    </style>
</head>
<body class="h-screen flex overflow-hidden text-slate-800">

    <!-- SIDEBAR: DANH SÁCH BÀI HỌC -->
    <aside class="w-72 bg-white border-r border-slate-200 flex flex-col h-full shrink-0 select-none">
        <div class="p-4 border-b border-slate-200 flex items-center gap-3 bg-red-600 text-white">
            <i class="fa-solid fa-language text-2xl"></i>
            <div>
                <h1 class="font-bold text-base leading-tight">Hán Ngữ Thực Chiến</h1>
                <p class="text-xs text-red-100">Từ Vựng • Ngữ Pháp • Phản Xạ</p>
            </div>
        </div>
        
        <div class="p-3 bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
            Danh mục bài học
        </div>

        <div id="topic-list" class="flex-1 overflow-y-auto p-2 space-y-1">
            <!-- Danh sách topic render tự động bằng JS -->
        </div>

        <div class="p-3 border-t border-slate-200 bg-slate-50 text-xs text-slate-500 flex justify-between items-center">
            <span>Tốc độ đọc:</span>
            <select id="speech-rate" class="bg-white border border-slate-300 rounded px-2 py-1 text-slate-700 font-medium focus:outline-none focus:border-red-500">
                <option value="0.7">Chậm (0.7x)</option>
                <option value="0.9" selected>Vừa (0.9x)</option>
                <option value="1.0">Chuẩn (1.0x)</option>
            </select>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col h-full overflow-hidden">
        
        <!-- HEADER & TABS -->
        <header class="bg-white border-b border-slate-200 shrink-0">
            <div class="px-6 py-4 flex justify-between items-center">
                <div>
                    <span id="current-topic-badge" class="text-xs font-bold uppercase px-2.5 py-1 rounded bg-red-100 text-red-700">Bài mở đầu</span>
                    <h2 id="current-topic-title" class="text-xl font-bold text-slate-800 mt-1">Làm Quen Chữ Hán & Pinyin</h2>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="togglePinyinGlobal()" id="btn-toggle-pinyin" class="text-xs px-3 py-2 rounded-lg border border-slate-300 hover:bg-slate-100 font-medium flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-eye"></i> <span>Ẩn/Hiện Pinyin</span>
                    </button>
                </div>
            </div>

            <!-- Thanh điều hướng Tab (Chỉ hiện cho các Topic bài học) -->
            <nav id="standard-tabs" class="flex px-6 border-t border-slate-100 hidden">
                <button onclick="switchTab('vocab')" id="tab-btn-vocab" class="px-5 py-3 text-sm font-medium text-slate-600 hover:text-red-600 flex items-center gap-2 transition tab-active">
                    <i class="fa-solid fa-book-open"></i> 1. Từ Vựng Mới
                </button>
                <button onclick="switchTab('grammar')" id="tab-btn-grammar" class="px-5 py-3 text-sm font-medium text-slate-600 hover:text-red-600 flex items-center gap-2 transition">
                    <i class="fa-solid fa-puzzle-piece"></i> 2. Ngữ Pháp
                </button>
                <button onclick="switchTab('dialogue')" id="tab-btn-dialogue" class="px-5 py-3 text-sm font-medium text-slate-600 hover:text-red-600 flex items-center gap-2 transition">
                    <i class="fa-solid fa-comments"></i> 3. Hội Thoại Giao Tiếp
                </button>
                <button onclick="switchTab('exercises')" id="tab-btn-exercises" class="px-5 py-3 text-sm font-medium text-slate-600 hover:text-red-600 flex items-center gap-2 transition">
                    <i class="fa-solid fa-pen-to-square"></i> 4. Bài Tập Thực Chiến
                </button>
            </nav>

            <!-- Thanh điều hướng Tab riêng cho Bài Mở Đầu (Bài 0) -->
            <nav id="intro-tabs" class="flex px-6 border-t border-slate-100">
                <button onclick="switchIntroTab('tones')" id="intro-btn-tones" class="px-5 py-3 text-sm font-medium text-slate-600 hover:text-red-600 flex items-center gap-2 transition tab-active">
                    <i class="fa-solid fa-music"></i> 1. Thanh Điệu & Biến Điệu
                </button>
                <button onclick="switchIntroTab('initials')" id="intro-btn-initials" class="px-5 py-3 text-sm font-medium text-slate-600 hover:text-red-600 flex items-center gap-2 transition">
                    <i class="fa-solid fa-microphone-lines"></i> 2. Thanh Mẫu (Phụ Âm)
                </button>
                <button onclick="switchIntroTab('finals')" id="intro-btn-finals" class="px-5 py-3 text-sm font-medium text-slate-600 hover:text-red-600 flex items-center gap-2 transition">
                    <i class="fa-solid fa-wave-square"></i> 3. Vận Mẫu & Đánh Vần
                </button>
                <button onclick="switchIntroTab('strokes')" id="intro-btn-strokes" class="px-5 py-3 text-sm font-medium text-slate-600 hover:text-red-600 flex items-center gap-2 transition">
                    <i class="fa-solid fa-paintbrush"></i> 4. Quy Tắc Chữ Hán
                </button>
            </nav>
        </header>

        <!-- KHU VỰC HIỂN THỊ NỘI DUNG TỪNG TAB (CUỘN ĐỘC LẬP) -->
        <div id="content-area" class="flex-1 overflow-y-auto p-6">
            <!-- Nội dung sẽ được nạp động bằng JS -->
        </div>

    </main>

    <!-- JAVASCRIPT & DỮ LIỆU -->
    <script>
        // Cấu hình trạng thái ứng dụng
        let currentTopicIndex = 0;
        let currentTab = 'vocab';
        let currentIntroTab = 'tones';
        let showPinyin = true;

        // Hàm phát âm tiếng Trung chuẩn
        function speak(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            const rateSelect = document.getElementById('speech-rate');
            utterance.rate = rateSelect ? parseFloat(rateSelect.value) : 0.9;
            window.speechSynthesis.speak(utterance);
        }

        // =========================================================================
        // DỮ LIỆU BÀI HỌC (KHO TÀI LIỆU)
        // =========================================================================
        const COURSE_DATA = [
            // ---------------------------------------------------------------------
            // BÀI MỞ ĐẦU: PINYIN, THANH ĐIỆU & CHỮ HÁN (CỐ ĐỊNH)
            // ---------------------------------------------------------------------
            {
                id: "intro",
                badge: "Bài Mở Đầu",
                title: "Làm Quen Chữ Hán, Pinyin & Thanh Điệu",
                type: "intro",
                tones: [
                    { name: "Thanh 1 (mā)", pitch: "Cao và bằng phẳng (55)", desc: "Giống như đọc không dấu trong tiếng Việt nhưng kéo dài và giữ đều âm ở nốt cao.", example: "妈 (mā) - Mẹ", speakText: "妈" },
                    { name: "Thanh 2 (má)", pitch: "Từ trung bình vút lên cao (35)", desc: "Tương tự dấu sắc trong tiếng Việt, giọng nâng lên rõ rệt ở cuối.", example: "麻 (má) - Tê / Cây gai", speakText: "麻" },
                    { name: "Thanh 3 (mǎ)", pitch: "Trầm xuống rồi vút lên (214)", desc: "Giống dấu hỏi pha dấu ngã, hạ giọng xuống thấp nhất rồi mới vòng lên.", example: "马 (mǎ) - Con ngựa", speakText: "马" },
                    { name: "Thanh 4 (mà)", pitch: "Từ cao dứt khoát dội xuống (51)", desc: "Đọc mạnh, ngắn và dứt khoát từ trên cao xuống thấp.", example: "骂 (mà) - Mắng", speakText: "骂" },
                    { name: "Thanh nhẹ (ma)", pitch: "Nhẹ và ngắn", desc: "Không có ký hiệu dấu, đọc lướt nhẹ và ngắn bằng nửa các thanh khác.", example: "吗 (ma) - Không (trợ từ)", speakText: "吗" }
                ],
                toneRules: [
                    { title: "Biến điệu hai thanh 3 đi liền nhau (3 + 3 ➔ 2 + 3)", detail: "Khi hai âm tiết mang thanh 3 đứng cạnh nhau, âm thứ nhất đọc thành thanh 2 (dấu sắc), nhưng khi viết Pinyin vẫn giữ nguyên dấu thanh 3.", ex: "你好 (nǐ hǎo ➔ đọc là ní hǎo)" },
                    { title: "Biến điệu của 不 (bù)", detail: "Bình thường đọc là 'bù' (thanh 4). Khi đứng trước một âm tiết mang thanh 4 khác, 'bù' biến thành 'bú' (thanh 2).", ex: "不是 (bù shì ➔ đọc là bú shì) | 不去 (bù qù ➔ đọc là bú qù)" },
                    { title: "Biến điệu của 一 (yī)", detail: "Đọc là 'yī' khi đếm số. Đứng trước thanh 4 đọc thành 'yí' (thanh 2). Đứng trước thanh 1, 2, 3 đọc thành 'yì' (thanh 4).", ex: "一个 (yī gè ➔ yí gè) | 一天 (yī tiān ➔ yì tiān)" }
                ],
                initials: [
                    { group: "Nhóm môi", items: [
                        { p: "b", guide: "Như 'p' (không bật hơi)", ex: "爸 (bà)" },
                        { p: "p", guide: "Như 'p' nhưng BẬT HƠI mạnh", ex: "怕 (pà)" },
                        { p: "m", guide: "Như 'm' tiếng Việt", ex: "妈 (mā)" },
                        { p: "f", guide: "Như 'ph' tiếng Việt", ex: "发 (fā)" }
                    ]},
                    { group: "Nhóm đầu lưỡi", items: [
                        { p: "d", guide: "Như 't' tiếng Việt (không bật hơi)", ex: "大 (dà)" },
                        { p: "t", guide: "Như 'th' tiếng Việt (bật hơi)", ex: "他 (tā)" },
                        { p: "n", guide: "Như 'n' tiếng Việt", ex: "那 (nà)" },
                        { p: "l", guide: "Như 'l' tiếng Việt", ex: "来 (lái)" }
                    ]},
                    { group: "Nhóm cuống lưỡi", items: [
                        { p: "g", guide: "Như 'c/k' tiếng Việt", ex: "哥 (gē)" },
                        { p: "k", guide: "Như 'kh' nhưng bật hơi từ họng", ex: "看 (kàn)" },
                        { p: "h", guide: "Như 'h' pha 'kh' nhẹ", ex: "好 (hǎo)" }
                    ]},
                    { group: "Nhóm mặt lưỡi", items: [
                        { p: "j", guide: "Như 'ch' (môi kéo dẹt sang 2 bên)", ex: "家 (jiā)" },
                        { p: "q", guide: "Như 'ch' nhưng BẬT HƠI mạnh", ex: "去 (qù)" },
                        { p: "x", guide: "Như 'x' nhẹ, mặt lưỡi hạ thấp", ex: "谢 (xiè)" }
                    ]},
                    { group: "Nhóm đầu lưỡi trước (thẳng lưỡi)", items: [
                        { p: "z", guide: "Như 'ch' nhẹ, đầu lưỡi chạm răng", ex: "在 (zài)" },
                        { p: "c", guide: "Như 'z' nhưng BẬT HƠI mạnh", ex: "菜 (cài)" },
                        { p: "s", guide: "Như 'x' tiếng Việt", ex: "三 (sān)" }
                    ]},
                    { group: "Nhóm cong lưỡi", items: [
                        { p: "zh", guide: "Như 'tr' tiếng Việt (cong lưỡi)", ex: "这 (zhè)" },
                        { p: "ch", guide: "Như 'tr' cong lưỡi + BẬT HƠI", ex: "吃 (chī)" },
                        { p: "sh", guide: "Như 's' nặng (cong lưỡi)", ex: "是 (shì)" },
                        { p: "r", guide: "Như 'r' cong lưỡi (không rung)", ex: "人 (rén)" }
                    ]}
                ],
                finals: [
                    { group: "Vận mẫu đơn", list: [
                        { v: "a", way: "Đọc như 'a'", ex: "八 (bā)" },
                        { v: "o", way: "Đọc như 'ô' (hoặc 'ua' nhẹ khi ghép với b,p,m,f)", ex: "婆 (pó)" },
                        { v: "e", way: "Đọc như 'ơ' hoặc 'ư' sâu trong họng", ex: "喝 (hē)" },
                        { v: "i", way: "Đọc như 'i' (sau z,c,s,zh,ch,sh,r thì đọc thành 'ư')", ex: "你 (nǐ) / 吃 (chī)" },
                        { v: "u", way: "Đọc như 'u'", ex: "不 (bù)" },
                        { v: "ü", way: "Đọc như 'uy' tròn môi giữ nguyên", ex: "女 (nǚ)" }
                    ]},
                    { group: "Vận mẫu kép & Mũi hay dùng", list: [
                        { v: "ai / ei", way: "ai (như ai) / ei (như ây)", ex: "买 (mǎi) / 美 (měi)" },
                        { v: "ao / ou", way: "ao (như ao) / ou (như âu)", ex: "好 (hǎo) / 走 (zǒu)" },
                        { v: "an / en", way: "an (như an) / en (như ân)", ex: "看 (kàn) / 人 (rén)" },
                        { v: "ang / eng / ong", way: "ang / âng / ung (âm mũi sâu)", ex: "忙 (máng) / 冷 (lěng) / 懂 (dǒng)" },
                        { v: "ia / ie / iao / iu", way: "ia / iê / eo / iâu", ex: "家 (jiā) / 谢 (xiè) / 要 (yào) / 六 (liù)" },
                        { v: "ua / uo / uai / ui", way: "oa / uô / oai / uây", ex: "话 (huà) / 我 (wǒ) / 快 (kuài) / 对 (duì)" }
                    ]}
                ],
                strokes: [
                    { rule: "1. Ngang trước, sổ sau", desc: "Viết nét ngang (一) trước, nét sổ thẳng (丨) đè lên sau.", ex: "十 (shí - số 10)" },
                    { rule: "2. Phẩy trước, mác sau", desc: "Nét xiên trái (丿) viết trước, nét xiên phải (乀) viết sau.", ex: "人 (rén - người), 八 (bā - số 8)" },
                    { rule: "3. Trên trước, dưới sau", desc: "Các bộ phận bên trên viết trước, bên dưới viết sau.", ex: "三 (sān - số 3)" },
                    { rule: "4. Trái trước, phải sau", desc: "Phần bên trái của chữ viết trước, phần bên phải viết sau.", ex: "好 (hǎo - tốt), 你 (nǐ - bạn)" },
                    { rule: "5. Ngoài trước, trong sau", desc: "Viết khung bao quanh bên ngoài trước, phần ruột bên trong sau.", ex: "月 (yuè - mặt trăng), 同 (tóng - cùng)" },
                    { rule: "6. Vào nhà trước, đóng cửa sau", desc: "Với khung kín 4 phía, viết khung ngoài ➔ viết ruột trong ➔ nét đáy đóng khung cuối cùng.", ex: "国 (guó - đất nước), 回 (huí - về)" },
                    { rule: "7. Giữa trước, hai bên sau", desc: "Khi có trục đối xứng ở giữa, viết trục giữa trước rồi mới chấm/phẩy hai bên.", ex: "小 (xiǎo - nhỏ), 水 (shuǐ - nước)" }
                ]
            },

            // ---------------------------------------------------------------------
            // TOPIC 1: CHÀO HỎI & LÀM QUEN (MẪU ĐẦY ĐỦ 4 TAB)
            // ---------------------------------------------------------------------
            {
                id: "topic-1",
                badge: "Topic 1",
                title: "Chào Hỏi, Làm Quen & Hỏi Thăm Cơ Bản",
                type: "standard",
                // 1. TỪ VỰNG (4 cột: Hán tự, Pinyin, Từ loại, Nghĩa) - Bao quát toàn bộ hội thoại
                vocab: [
                    { hanzi: "你", pinyin: "nǐ", pos: "Đại từ", meaning: "Bạn, anh, chị (ngôi thứ 2)" },
                    { hanzi: "好", pinyin: "hǎo", pos: "Tính từ", meaning: "Tốt, khỏe, hay" },
                    { hanzi: "我", pinyin: "wǒ", pos: "Đại từ", meaning: "Tôi, mình (ngôi thứ 1)" },
                    { hanzi: "叫", pinyin: "jiào", pos: "Động từ", meaning: "Gọi là, tên là" },
                    { hanzi: "小", pinyin: "xiǎo", pos: "Tính từ", meaning: "Nhỏ, tiểu (dùng trước tên gọi thân mật)" },
                    { hanzi: "明", pinyin: "míng", pos: "Danh từ", meaning: "Minh (tên riêng), sáng sủa" },
                    { hanzi: "呢", pinyin: "ne", pos: "Trợ từ", meaning: "Thế, còn... thì sao? (cuối câu hỏi)" },
                    { hanzi: "是", pinyin: "shì", pos: "Động từ", meaning: "Là, đúng, phải" },
                    { hanzi: "兰", pinyin: "lán", pos: "Danh từ", meaning: "Lan (tên riêng), hoa lan" },
                    { hanzi: "越", pinyin: "yuè", pos: "Danh từ", meaning: "Việt (trong Việt Nam)" },
                    { hanzi: "南", pinyin: "nán", pos: "Danh từ", meaning: "Phía nam (越南: Việt Nam)" },
                    { hanzi: "人", pinyin: "rén", pos: "Danh từ", meaning: "Người" },
                    { hanzi: "吗", pinyin: "ma", pos: "Trợ từ", meaning: "Không, à? (đặt cuối câu hỏi Có/Không)" },
                    { hanzi: "也", pinyin: "yě", pos: "Phó từ", meaning: "Cũng" },
                    { hanzi: "不", pinyin: "bù", pos: "Phó từ", meaning: "Không (phủ định)" },
                    { hanzi: "中", pinyin: "zhōng", pos: "Danh từ", meaning: "Ở giữa, trung (中国: Trung Quốc)" },
                    { hanzi: "国", pinyin: "guó", pos: "Danh từ", meaning: "Đất nước, quốc gia" },
                    { hanzi: "很", pinyin: "hěn", pos: "Phó từ", meaning: "Rất" },
                    { hanzi: "高", pinyin: "gāo", pos: "Tính từ", meaning: "Cao (高兴: vui vẻ)" },
                    { hanzi: "兴", pinyin: "xìng", pos: "Tính từ", meaning: "Hứng thú (高兴: vui mừng, phấn khởi)" },
                    { hanzi: "认", pinyin: "rèn", pos: "Động từ", meaning: "Nhận (认识: quen biết)" },
                    { hanzi: "识", pinyin: "shi", pos: "Động từ", meaning: "Biết (认识: quen biết)" },
                    { hanzi: "今", pinyin: "jīn", pos: "Danh từ", meaning: "Nay, hiện tại (今天: hôm nay)" },
                    { hanzi: "天", pinyin: "tiān", pos: "Danh từ", meaning: "Trời, ngày" },
                    { hanzi: "工", pinyin: "gōng", pos: "Danh từ", meaning: "Công việc (工作: làm việc / công việc)" },
                    { hanzi: "作", pinyin: "zuò", pos: "Động/Danh", meaning: "Làm (工作: làm việc)" },
                    { hanzi: "忙", pinyin: "máng", pos: "Tính từ", meaning: "Bận, bận rộn" },
                    { hanzi: "太", pinyin: "tài", pos: "Phó từ", meaning: "Quá, lắm (不太: không... lắm)" },
                    { hanzi: "累", pinyin: "lèi", pos: "Tính từ", meaning: "Mệt, mệt mỏi" },
                    { hanzi: "现", pinyin: "xiàn", pos: "Danh từ", meaning: "Hiện tại (现在: bây giờ)" },
                    { hanzi: "在", pinyin: "zài", pos: "Phó/Giới", meaning: "Đang, ở tại (现在: bây giờ)" },
                    { hanzi: "去", pinyin: "qù", pos: "Động từ", meaning: "Đi, đi đến" },
                    { hanzi: "喝", pinyin: "hē", pos: "Động từ", meaning: "Uống" },
                    { hanzi: "咖", pinyin: "kā", pos: "Danh từ", meaning: "Cà (咖啡: cà phê)" },

        function initApp() {
            renderSidebar();

        function renderSidebar() {
            const listEl = document.getElementById('topic-list');
            listEl.innerHTML = COURSE_DATA.map((topic, index) => `
                <button onclick="selectTopic(${index})" id="sidebar-topic-${index}" 
                    class="w-full text-left px-3 py-2.5 rounded-lg text-sm transition flex items-center justify-between ${index === currentTopicIndex ? 'topic-active' : 'text-slate-700 hover:bg-slate-100'}">
                    <div class="truncate pr-2">
                        <span class="text-xs uppercase font-bold opacity-80 block">${topic.badge}</span>
                        <span class="truncate block">${topic.title}</span>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs opacity-60"></i>
                </button>
            `).join('');
        }

        function selectTopic(index) {
            currentTopicIndex = index;
            const topic = COURSE_DATA[index];

            // Cập nhật trạng thái active trên sidebar
            COURSE_DATA.forEach((_, idx) => {
                const btn = document.getElementById(`sidebar-topic-${idx}`);
                if (idx === index) {
                    btn.classList.add('topic-active');
                    btn.classList.remove('text-slate-700', 'hover:bg-slate-100');
                } else {
                    btn.classList.remove('topic-active');
                    btn.classList.add('text-slate-700', 'hover:bg-slate-100');
                }
            });

            // Cập nhật Header
            document.getElementById('current-topic-badge').textContent = topic.badge;
            document.getElementById('current-topic-title').textContent = topic.title;

            // Ẩn/Hiện thanh Tab tương ứng
            const introTabs = document.getElementById('intro-tabs');
            const standardTabs = document.getElementById('standard-tabs');

            if (topic.type === 'intro') {
                introTabs.classList.remove('hidden');
                standardTabs.classList.add('hidden');
                switchIntroTab('tones');
            } else {
                introTabs.classList.add('hidden');
                standardTabs.classList.remove('hidden');
                switchTab('vocab');
            }
        }

        function togglePinyinGlobal() {
            showPinyin = !showPinyin;
            const btn = document.getElementById('btn-toggle-pinyin');
            btn.innerHTML = showPinyin 
                ? `<i class="fa-solid fa-eye"></i> <span>Ẩn Pinyin</span>` 
                : `<i class="fa-solid fa-eye-slash text-red-600"></i> <span class="text-red-600">Hiện Pinyin</span>`;
            
            const topic = COURSE_DATA[currentTopicIndex];
            if (topic.type === 'intro') {
                renderIntroContent();
            } else {
                renderStandardContent();
            }
        }

                                        </div>
                                        <div id="trans-msg-${tIdx}" class="text-xs font-semibold mt-2"></div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                    </div>
                `;
            }
        }

        function renderVocabRows(vocabList) {
            return vocabList.map((v, i) => `
                <tr onclick="speak('${v.hanzi}')" class="hover:bg-red-50/50 cursor-pointer transition">
                    <td class="py-3 px-4 text-center text-xs text-slate-400 font-medium">${i + 1}</td>
                    <td class="py-3 px-4 font-bold text-lg text-slate-900 hanzi flex items-center gap-2">
                        ${v.hanzi} <i class="fa-solid fa-volume-low text-xs text-slate-400"></i>
                    </td>
                    <td class="py-3 px-4 font-semibold text-red-600">${showPinyin ? v.pinyin : '***'}</td>
                    <td class="py-3 px-4">
                        <span class="text-xs px-2 py-0.5 rounded bg-slate-100 text-slate-600 font-medium">${v.pos}</span>
                    </td>
                    <td class="py-3 px-4 text-slate-700 font-medium">${v.meaning}</td>
                </tr>
            `).join('');
        }

        function filterVocab() {
            const query = document.getElementById('vocab-search').value.toLowerCase().trim();
            const topic = COURSE_DATA[currentTopicIndex];
            const filtered = topic.vocab.filter(v => 
                v.hanzi.includes(query) || 
                v.pinyin.toLowerCase().includes(query) || 
                v.meaning.toLowerCase().includes(query)
            );
            document.getElementById('vocab-table-body').innerHTML = renderVocabRows(filtered);
        }

        function playAllDialogue() {
            const topic = COURSE_DATA[currentTopicIndex];
            if (!topic.dialogue) return;
            const fullText = topic.dialogue.map(d => d.hanzi).join('。');
            speak(fullText);
        }

        // =========================================================================
        // LOGIC CHẤM ĐIỂM BÀI TẬP
        // =========================================================================
        function checkQuiz(qIdx, oIdx) {
            const topic = COURSE_DATA[currentTopicIndex];
            const q = topic.exercises.quiz[qIdx];
            const expEl = document.getElementById(`quiz-exp-${qIdx}`);

            q.options.forEach((_, idx) => {
                const btn = document.getElementById(`quiz-${qIdx}-opt-${idx}`);
                btn.classList.remove('bg-emerald-100', 'border-emerald-500', 'bg-red-100', 'border-red-500');
                if (idx === q.correct) {
                    btn.classList.add('bg-emerald-100', 'border-emerald-500', 'font-bold');
                } else if (idx === oIdx) {
                    btn.classList.add('bg-red-100', 'border-red-500');
                }
            });

            expEl.classList.remove('hidden');
            expEl.innerHTML = (oIdx === q.correct ? '✅ <strong>Chính xác!</strong> ' : '❌ <strong>Chưa đúng!</strong> ') + q.explain;
            speak(q.options[q.correct]);
        }

        let scrambleState = {};
        function addScrambleWord(sIdx, word) {
            if (!scrambleState[sIdx]) scrambleState[sIdx] = [];
            scrambleState[sIdx].push(word);
            updateScrambleUI(sIdx);
            speak(word);
        }

        function resetScramble(sIdx) {
            scrambleState[sIdx] = [];
            updateScrambleUI(sIdx);
            document.getElementById(`scramble-msg-${sIdx}`).textContent = '';
        }

        function updateScrambleUI(sIdx) {
            const box = document.getElementById(`scramble-ans-${sIdx}`);
            box.innerHTML = (scrambleState[sIdx] || []).map(w => `
                <span class="px-2.5 py-1 rounded bg-red-50 border border-red-200">${w}</span>
            `).join('');
        }

        function checkScramble(sIdx) {
            const topic = COURSE_DATA[currentTopicIndex];
            const target = topic.exercises.scramble[sIdx].answer;
            const userAns = (scrambleState[sIdx] || []).join('');
            const msgEl = document.getElementById(`scramble-msg-${sIdx}`);

            if (userAns === target) {
                msgEl.className = "text-xs font-bold text-emerald-600 ml-2";
                msgEl.textContent = "✅ Chính xác tuyệt đối!";
                speak(target);
            } else {
                msgEl.className = "text-xs font-bold text-red-600 ml-2";
                msgEl.textContent = `❌ Chưa khớp. Đáp án: ${target}`;
            }
        }

        function checkTranslate(tIdx) {
            const topic = COURSE_DATA[currentTopicIndex];
            const item = topic.exercises.translate[tIdx];
            const inputVal = document.getElementById(`trans-input-${tIdx}`).value.trim();
            const msgEl = document.getElementById(`trans-msg-${tIdx}`);

            const cleanInput = inputVal.replace(/[.,?!，。？！]/g, '');
            const isCorrect = item.accepted.some(ans => ans.replace(/[.,?!，。？！]/g, '') === cleanInput);

            if (isCorrect) {
                msgEl.className = "text-xs font-bold text-emerald-600 mt-2 hanzi";
                msgEl.textContent = `✅ Chuẩn xác! (${item.accepted[0]})`;
                speak(item.accepted[0]);
            } else {
                msgEl.className = "text-xs font-bold text-red-600 mt-2 hanzi";
                msgEl.textContent = `❌ Gợi ý đáp án chuẩn: ${item.accepted[0]}`;
            }
        }

        // Khởi chạy khi tải trang
        window.onload = initApp;
    </script>
</body>
</html>
